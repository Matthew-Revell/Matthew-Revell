name: Metrics

on:
  schedule:
    # Daily at 14:00 UTC, morning in America/Denver.
    - cron: "0 14 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Render metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Matthew-Revell
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Denver
          filename: metrics.svg
          committer_branch: main
          output_action: commit
          # Purge unused CSS and pretty-print the XML so the committed SVG stays readable.
          optimize: css, xml
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_repositories: yes
          plugin_repositories_featured: Matthew-Revell/Bite,Matthew-Revell/ribbonwren-bingo
